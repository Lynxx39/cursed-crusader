<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cursed Crusader: The Beast Within</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23090c14'/%3E%3Cpath fill='%23ef4444' d='M4 3h8v6h-2v3H6V9H4V3zm2 2v2h2V5H6zm3 0v2h2V5H9z'/%3E%3Cpath fill='%23fbbf24' d='M7 1h2v2H7zM2 6h2v2H2zm10 0h2v2h-2z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #131929 0%, #07090f 65%, #030407 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #263147;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 36px rgba(124, 58, 237, 0.12);
      border-radius: 3px;
    }

    #controls-hint {
      position: absolute;
      bottom: 5px;
      font-size: 8.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #94a3b8;
      background: rgba(8, 11, 18, 0.86);
      backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 12px);
      overflow: hidden;
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      transition: opacity 0.2s ease;
    }

    #controls-hint span {
      color: #fbbf24;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid rgba(245, 158, 11, 0.22);
    }

    @keyframes gothic-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #ef4444;
      font-family: 'Cinzel', serif;
      position: absolute;
      z-index: 5;
      text-align: center;
    }

    #initial-loading .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #1e293b;
      border-top: 3px solid #dc2626;
      border-radius: 50%;
      animation: gothic-spin 0.9s linear infinite;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="initial-loading">
      <div style="font-size: 26px; font-weight: 900; letter-spacing: 4px; color: #f87171; text-shadow: 0 0 20px rgba(220, 38, 38, 0.6);">CURSED CRUSADER</div>
      <div class="spinner"></div>
      <div style="font-size: 11px; color: #94a3b8; font-family: monospace; letter-spacing: 1px;">SUMMONING DARK EXPEDITION...</div>
    </div>
  </div>
  <div id="controls-hint">
    Move <span>A/D</span> | Jump <span>W/Space</span> | Atk <span>LMB</span> | Dash <span>RMB/Shift</span> | Parry <span>K/X</span> | Skill <span>Q</span> | Quint <span>G</span> | Pot <span>F</span> | Swap <span>Tab/C</span> | Awaken <span>U</span> | Finisher <span>I</span> | <span>H</span> Hint
  </div>
  <script>
    // Prevent context menu on right click for instant responsive dashing
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Toggle controls hint with 'H'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const hint = document.getElementById('controls-hint');
        if (hint) {
          hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
      }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
