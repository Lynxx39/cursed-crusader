<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <title>Cursed Crusader: The Beast Within</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">
  <style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;margin:0;padding:0}body,html{color:#e2e8f0;background:radial-gradient(circle at 50% 42%,#131929 0%,#07090f 65%,#030407 100%);flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;display:flex;overflow:hidden}#game-container{justify-content:center;align-items:center;width:100%;height:100%;display:flex;position:relative}canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid #263147;border-radius:3px;display:block;box-shadow:0 24px 70px #000000d9,0 0 36px #7c3aed1f}#controls-hint{color:#94a3b8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap;z-index:10;text-transform:uppercase;letter-spacing:.2px;background:#080b12db;border:1px solid #f59e0b40;border-radius:999px;max-width:calc(100vw - 12px);padding:3px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;transition:opacity .2s;position:absolute;bottom:5px;overflow:hidden;box-shadow:0 4px 16px #00000080}#controls-hint span{color:#fbbf24;background:#f59e0b1f;border:1px solid #f59e0b38;border-radius:3px;padding:1px 4px;font-weight:700}@keyframes gothic-spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}#initial-loading{color:#ef4444;z-index:5;text-align:center;flex-direction:column;align-items:center;gap:16px;font-family:Cinzel,serif;display:flex;position:absolute}#initial-loading .spinner{border:3px solid #1e293b;border-top-color:#dc2626;border-radius:50%;width:44px;height:44px;animation:.9s linear infinite gothic-spin}</style>
  <script type="module" crossorigin src="./assets/index-Ca5BO6BB.js"></script>
</head>

<body>
  <div id="game-container">
    <div id="initial-loading">
      <div style="font-size: 26px; font-weight: 900; letter-spacing: 4px; color: #f87171; text-shadow: 0 0 20px rgba(220, 38, 38, 0.6);">CURSED CRUSADER</div>
      <div class="spinner"></div>
      <div style="font-size: 11px; color: #94a3b8; font-family: monospace; letter-spacing: 1px;">SUMMONING DARK EXPEDITION...</div>
    </div>
  </div>
  <div id="controls-hint">
    Move <span>A/D</span> | Jump <span>W/Space</span> | Atk <span>LMB</span> | Dash <span>RMB/Shift</span> | Parry <span>K/X</span> | Skill <span>Q</span> | Quint <span>G</span> | Pot <span>F</span> | Swap <span>Tab/C</span> | Awaken <span>U</span> | Finisher <span>I</span> | <span>H</span> Hint
  </div>
  <script>
    // Prevent context menu on right click for instant responsive dashing
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Toggle controls hint with 'H'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const hint = document.getElementById('controls-hint');
        if (hint) {
          hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
      }
    });
  </script>
</body>

</html>
