<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cursed Crusader: The Beast Within</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap"
    rel="stylesheet">
  <style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;margin:0;padding:0}body,html{color:#e2e8f0;background-color:#08090c;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;display:flex;overflow:hidden}#game-container{justify-content:center;align-items:center;width:100%;height:100%;display:flex;position:relative}canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid #232733;display:block;box-shadow:0 0 50px #991b1b4d}#controls-hint{color:#94a3b8;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:none;z-index:10;text-transform:uppercase;letter-spacing:.5px;background:#0a0c10bf;border:1px solid #33415566;border-radius:4px;padding:3px 14px;font-size:10px;transition:opacity .2s;position:absolute;bottom:4px}#controls-hint span{color:#f59e0b;font-weight:700}@keyframes gothic-spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}#initial-loading{color:#ef4444;z-index:5;text-align:center;flex-direction:column;align-items:center;gap:16px;font-family:Cinzel,serif;display:flex;position:absolute}#initial-loading .spinner{border:3px solid #1e293b;border-top-color:#dc2626;border-radius:50%;width:44px;height:44px;animation:.9s linear infinite gothic-spin}</style>
  <script type="module" crossorigin src="./assets/index-DlNRAZP_.js"></script>
</head>

<body>
  <div id="game-container">
    <div id="initial-loading">
      <div style="font-size: 26px; font-weight: 900; letter-spacing: 4px; color: #f87171; text-shadow: 0 0 20px rgba(220, 38, 38, 0.6);">CURSED CRUSADER</div>
      <div class="spinner"></div>
      <div style="font-size: 11px; color: #94a3b8; font-family: monospace; letter-spacing: 1px;">SUMMONING DARK EXPEDITION...</div>
    </div>
  </div>
  <div id="controls-hint">
    Move: <span>A / D</span> | Jump: <span>W / SPACE</span> | Attack: <span>LMB</span> | Dash: <span>RMB / SHIFT</span> | Parry: <span>K / X</span> | Potion: <span>F</span> | Swap Form: <span>TAB / C</span> | Awaken: <span>U</span> | Finisher: <span>I</span> | <span>[H]</span> Toggle Hint
  </div>
  <script>
    // Prevent context menu on right click for instant responsive dashing
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Toggle controls hint with 'H'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const hint = document.getElementById('controls-hint');
        if (hint) {
          hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
      }
    });
  </script>
</body>

</html>
