<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cursed Crusader: The Beast Within</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08090c;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 50px rgba(153, 27, 27, 0.3);
      border: 1px solid #232733;
    }

    #controls-hint {
      position: absolute;
      bottom: 4px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(10, 12, 16, 0.75);
      backdrop-filter: blur(4px);
      padding: 3px 14px;
      border-radius: 4px;
      border: 1px solid rgba(51, 65, 85, 0.4);
      pointer-events: none;
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: opacity 0.2s ease;
    }

    #controls-hint span {
      color: #f59e0b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <div id="controls-hint">
    Move: <span>A / D</span> | Jump: <span>W / SPACE</span> | Attack: <span>LMB</span> | Dash: <span>RMB</span> | Parry:
    <span>K / X</span> | Awaken: <span>U</span> | Finisher: <span>I</span> | <span>[H]</span> Toggle Hint
  </div>
  <script>
    // Prevent context menu on right click for instant responsive dashing
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Toggle controls hint with 'H'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const hint = document.getElementById('controls-hint');
        if (hint) {
          hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
      }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
